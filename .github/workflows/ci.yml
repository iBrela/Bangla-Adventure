name: CI

# Every job runs one of the shared scripts in scripts/ci, which GitLab (.gitlab-ci.yml) and
# Jenkins (Jenkinsfile) run too. On the default branch the tested image is published to
# ghcr.io/<owner>/bangla-adventure, the owner being whichever account holds this repository (lowercased,
# as GHCR requires), and, once the server is configured, deployed to it (docs/DEPLOYMENT.md "Automatic
# deployment"). After a transfer the image therefore moves to the new owner's package with no edit here
# (docs/REPOSITORY_TRANSFER.md).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_loopback:
        description: Deploy production to loopback port 3001 before the domain's Nginx/HTTPS setup
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/ci/verify.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/ci/e2e.sh
      - name: Retain browser screenshots and failure traces
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
      # Re-running the same commit may replace its tag; pass this run's pushed digest onward.
      image_ref: ${{ steps.push.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v5
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bangla-adventure" >> "$GITHUB_OUTPUT"
      - name: Build the production image and run the container smoke test
        env:
          IMAGE_SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: bash scripts/ci/container.sh bangla-adventures:ci
      # Each tested image is kept under its commit; it is only marked latest and deployed once
      # every job has passed. A manual run publishes from any branch, for checking the setup.
      - name: Publish this commit's image
        id: push
        if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || github.event_name == 'workflow_dispatch'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: PUBLISH_DIGEST_OUTPUT="$GITHUB_OUTPUT" bash scripts/ci/publish.sh push bangla-adventures:ci "${{ steps.name.outputs.image }}:sha-${GITHUB_SHA}"

  publish:
    needs: [verify, e2e, container]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Runs on the default branch can finish in any order, and re-running an old run's failed jobs
      # would publish its older commit again, so only the branch's newest commit goes on.
      - id: current
        name: Check this is the newest commit on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if bash scripts/ci/newest.sh "$BRANCH"; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mark the tested image as latest
        if: steps.current.outputs.newest == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.container.outputs.image }}
          IMAGE_REF: ${{ needs.container.outputs.image_ref }}
        run: bash scripts/ci/publish.sh promote "${IMAGE_REF:?Missing verified image digest}" "$IMAGE:latest"

  # Ordinary releases require the repository variable DEPLOY_ENABLED=true; a manual loopback
  # bootstrap is explicitly requested through workflow_dispatch. This gate runs before the production
  # environment loads. The confirmed VPS address is the deployment target below; the SSH account
  # and key remain in production secrets. SSH still verifies the previously supplied host-key pin.
  # Add required reviewers to the "production" environment to approve each deploy.
  deploy:
    needs: [container, publish]
    if: vars.DEPLOY_ENABLED == 'true' || (github.event_name == 'workflow_dispatch' && inputs.deploy_loopback == true)
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      # As in publish: an older commit is never deployed over a newer one.
      - id: current
        name: Check this is the newest commit on the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if bash scripts/ci/newest.sh "$BRANCH"; then
            echo "newest=true" >> "$GITHUB_OUTPUT"
          else
            status=$?
            if [ "$status" -ne 1 ]; then exit "$status"; fi
            echo "newest=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to the server
        if: steps.current.outputs.newest == 'true'
        env:
          DEPLOY_ENABLED: 'true'
          DEPLOY_HOST: '169.40.116.23'
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/bangla-adventures' }}
          DEPLOY_PUBLIC_ORIGIN: https://banglaadventure.com
          DEPLOY_APP_PORT: '3001'
          DEPLOY_HOST_FINGERPRINT: ${{ vars.DEPLOY_HOST_FINGERPRINT || 'SHA256:79xe+ubCodL2ACAHPNloo7I/K6mvngU88vEiFoEeWL8' }}
          DEPLOY_KEY_FINGERPRINT: ${{ vars.DEPLOY_KEY_FINGERPRINT || 'SHA256:y1+C6cvcfpJFmO8pfjyMSFERpd5BtcQyDf5SptZXVlQ' }}
          DEPLOY_DOCKER_HOST: ${{ vars.DEPLOY_DOCKER_HOST || (vars.DEPLOY_DOCKER_CONTEXT == '' && 'unix:///run/user/1002/docker.sock') || '' }}
          DEPLOY_DOCKER_CONTEXT: ${{ vars.DEPLOY_DOCKER_CONTEXT }}
          DEPLOY_REQUIRE_ROOTLESS: 'true'
          # The same pinned VPS host key is accepted at its newly confirmed address.
          DEPLOY_REBIND_PINNED_HOST: 'true'
          # A deliberate manual bootstrap still requires app, proxy and host-loopback health.
          # All ordinary production deployments additionally require valid public HTTPS.
          DEPLOY_REQUIRE_PUBLIC_HEALTH: ${{ inputs.deploy_loopback != true }}
          PUBLIC_HEALTH_URL: ${{ inputs.deploy_loopback != true && vars.PUBLIC_HEALTH_URL || '' }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          # Optional narration settings for the server .env; an empty one leaves the server's value.
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL_ID: ${{ vars.ELEVENLABS_MODEL_ID }}
          ELEVENLABS_DAILY_CHARACTER_LIMIT: ${{ vars.ELEVENLABS_DAILY_CHARACTER_LIMIT }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_REF: ${{ needs.container.outputs.image_ref }}
        run: |
          echo "::add-mask::$DEPLOY_HOST"
          if [ "${DEPLOY_USER:-ba_deploy}" != ba_deploy ]; then
            echo '::error::DEPLOY_USER must match the confirmed VPS account.'
            exit 1
          fi
          bash scripts/deploy.sh "${IMAGE_REF:?Missing verified image digest}"
      - name: Check public DNS and HTTPS for the Nginx handoff
        if: steps.current.outputs.newest == 'true' && inputs.deploy_loopback == true
        run: |
          domain=banglaadventure.com
          if timeout 15 getent ahostsv4 "$domain" | awk '{print $1}' | sort -u | grep -Fxq '169.40.116.23'; then
            echo 'Public DNS resolves to the deployment VPS.'
          else
            echo '::notice::Public DNS did not resolve to the expected VPS from this runner.'
          fi
          response=$(mktemp)
          trap 'rm -f "$response"' EXIT
          if status=$(curl --proto '=https' --silent --show-error --connect-timeout 5 --max-time 15 \
            --max-filesize 65536 --output "$response" --write-out '%{http_code}' "https://$domain/api/health") &&
            [ "$status" = 200 ] && jq -e '.status == "ok"' "$response" >/dev/null; then
            echo 'Public HTTPS and the application health endpoint passed.'
          else
            echo "::notice::Public HTTPS application health is unconfirmed (HTTP ${status:-000})."
          fi
